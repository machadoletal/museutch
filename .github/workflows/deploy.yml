name: Deploy Museu TCH → GitHub Pages

on:
  push:
    branches:
      - claude/pearl-museum-site-QGWnE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Verificar senha configurada
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "ERRO: secret STATICRYPT_PASSWORD não encontrado ou vazio"
            exit 1
          fi
          echo "Senha encontrada (${#STATICRYPT_PASSWORD} caracteres). Criptografando..."
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

      - name: Proteger com senha (StatiCrypt)
        run: |
          npx staticrypt dist/index.html \
            -d dist \
            -p "$STATICRYPT_PASSWORD" \
            --remember 1 \
            --short \
            --template-title "Museu TCH" \
            --template-instructions "Digite a senha para acessar o acervo." \
            --template-placeholder "senha"
          echo "Tamanho do index.html após criptografia: $(wc -c < dist/index.html) bytes"
          grep -q "staticrypt" dist/index.html && echo "OK: index.html está criptografado" || echo "FALHOU: index.html não foi criptografado"
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}

      - name: Upload artifact para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
