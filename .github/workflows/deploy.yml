name: Deploy Museu TCH → GitHub Pages

on:
  push:
    branches:
      - main
  # Regenera os dados cifrados de hora em hora (pega novas entradas da planilha)
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verificar secrets
        run: |
          [ -n "$SHEET_ID" ] || { echo "ERRO: secret SHEET_ID ausente"; exit 1; }
          [ -n "$SITE_PASSWORD" ] || { echo "ERRO: secret SITE_PASSWORD ausente"; exit 1; }
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Build (busca + cifra os dados, depois compila)
        run: npm run build
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: Upload artifact para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
